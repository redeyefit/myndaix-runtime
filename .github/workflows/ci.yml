name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the running check — cancel it instead of paying
# for a result nobody reads (fold loops push 5-8 times per PR; the autofix rung adds its
# own). Main is exempt BOTH ways (review 20260911122807): cancel-in-progress false AND a
# per-run group — a shared main group would let GitHub silently EVICT a queued pending
# run (only one pending per group), dropping a merge receipt.
#
# ACCEPTED RISK (review 20260911124025 P1-A, documented not fixed): on the self-hosted
# runner, PR-branch code executes UNSANDBOXED on the factory host as the operator user.
# Accepted for this private, solo-author repo (pushers = Jefe + the policy-gated autofix
# loop); revisit with an isolated runner user/VM if the repo ever gains outside authors.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # SELF-HOSTED (2026-09-11, cost-zero CI): runs on the Mini's registered runner — Actions
    # minutes on self-hosted runners are unmetered. The suites hit the Mini's local Postgres
    # against the DEDICATED throwaway `runtime_ci` DB (they DROP/recreate its schema each run
    # — never point this at the ops `runtime` DB). FALLBACK to GitHub-hosted: restore
    # `runs-on: ubuntu-latest` + the postgres:16 service container (git history has the
    # exact block, removed in this commit) + the postgres:postgres@…/runtime_test DSN.
    runs-on: [self-hosted, mini]

    env:
      # runtime_ci is safe as a SHARED static DB only because ONE runner is registered —
      # a single runner executes one job at a time, so runs serialize (review 20260911131140
      # Medium, declined as machinery-for-a-topology-we-don't-have). REGISTERING A SECOND
      # RUNNER breaks this: scope the DB per run (runtime_ci_${{ github.run_id }} + create/
      # drop in the job) before ever doing that.
      LEDGER_TEST_DSN: postgresql://localhost:5432/runtime_ci
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
        with:
          # 2, not the default 1: the ruff ratchet below diffs HEAD^1. On a pull_request run HEAD is
          # the PR MERGE commit, so HEAD^1 is the base tip; on a push to main it is the previous main
          # tip. With depth 1 that commit is absent and tools/ruff_new.py fails CLOSED (rc 2).
          fetch-depth: 2

      # Mini-local Python instead of setup-python: on self-hosted macOS the action insists
      # on the GitHub-hosted toolcache path (/Users/runner — permission denied) and ignores
      # the runner's AGENT_TOOLSDIRECTORY. A per-run venv from the box's brewed 3.12 is
      # deterministic and ~20s with warm pip cache.
      - name: Set up venv (Mini-local Python 3.12)
        run: |
          /opt/homebrew/bin/python3.12 -m venv .ci-venv
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: pip install -e ".[dev]"          # dev extra brings pytest (+ pytest-asyncio) + the PINNED ruff

      # Ruff BEFORE the suites: a NEW finding vs HEAD^1 turns the job red in seconds instead of after the
      # 4-minute test run. tools/ruff_new.py is a finding-diff ratchet (the semantics of semgrep
      # --baseline-commit): pre-existing findings in a touched file never block, a fresh one anywhere in
      # it does. The rule set is the EXPLICIT [tool.ruff.lint] select in pyproject — ruff's defaults
      # drift between releases (0.16 turned on ~550 findings with no select configured).
      - name: Ruff version matches the pyproject pin
        run: ruff --version | grep -qx 'ruff 0.16.8' || { echo "::error::$(ruff --version) on PATH; pyproject pins ruff==0.16.8"; exit 1; }

      # HEAD^1 assumes HEAD's immediate parent is the base tip — false on a multi-commit direct
      # push to main (HEAD^1 would be a commit INSIDE that same push). Declined as unreachable:
      # main is PR-only (branch protection, enforce_admins on), so every change lands here via a
      # PR run, where HEAD is the merge commit and HEAD^1 is always the base tip it merged into.
      - name: Ruff — NEW findings vs base (blocking)
        run: python tools/ruff_new.py HEAD^1

      # The ~48 pre-existing findings for the same rule set, as a burn-down number. Never red. When it
      # reaches 0, drop --exit-zero here and delete the ratchet step: whole-repo blocking.
      - name: Ruff — whole-repo debt (report only)
        run: ruff check --exit-zero --statistics .

      - name: Run all test suites
        run: |
          set -e
          # Two test styles coexist: most suites are standalone (a `__main__` runner that
          # drives async via asyncio.run); test_stitch.py is pytest-style (fixtures/marks, no
          # runner). Route by the presence of a `__main__` block so each runs the right way —
          # running a pytest-style file as a bare script collects nothing and errors on import.
          for t in tests/test_*.py; do
            if grep -q '^if __name__' "$t"; then
              echo "== python $t =="; python "$t"
            else
              echo "== pytest $t =="; python -m pytest -q "$t"
            fi
          done

      - name: Bash quality (shellcheck + our semgrep bug-rules + bats)
        # bash-heavy repo; CodeQL doesn't cover bash. bash-check ERROR-gates (shellcheck + the custom
        # bug-rules + pipefail); bats runs the shell test suite. See tools/README.md.
        run: |
          set -e
          pip install semgrep==1.177.0
          if [ "$(uname)" = "Darwin" ]; then
            # self-hosted Mini: install-if-missing, idempotent after the first run
            command -v shellcheck >/dev/null || brew install -q shellcheck
            command -v bats >/dev/null || brew install -q bats-core
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
          fi
          ./tools/bash-check.sh
          bats tests/bash/

      - name: Substrate smoke + security harness
        # Fixture-only; portable (plistlib not macOS plutil; shellcheck skipped if absent). Catches
        # a stale migration_head.txt pin, config-parser/denylist regressions, quiesce-list drift.
        run: bash substrate/test.sh

      - name: Migration additivity lint (changed migrations vs main)
        # Belt-and-suspenders enforcement of §2.8 at PR time (reconcile enforces at deploy). Lints
        # only the migrations ADDED/MODIFIED/RENAMED vs the merge-base — a contraction fails CI.
        run: |
          git fetch --no-tags --depth=200 origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -z "$base" ]; then echo "no merge-base with origin/main — skipping (reconcile enforces at deploy)"; exit 0; fi
          changed="$(git diff --diff-filter=AMR --name-only "$base"..HEAD -- 'src/runtime/ledger/migrations/*.sql' || true)"
          if [ -z "$changed" ]; then echo "no migration changes vs main"; exit 0; fi
          echo "linting changed migrations:"; echo "$changed"
          # shellcheck disable=SC2086
          python substrate/migration_lint.py $changed

      - name: Skill stub gate (skills/**/SKILL.md)
        # An auto-proposed SKILL.md still carrying capture.py's STUB_MARKER (or empty) must turn
        # this check red: merging it unedited makes reconcile mark the capture class terminally
        # "promoted" while the controller's index step rejects the same blob — no re-proposal,
        # no skill, ever. The checker imports the SAME is_unauthored_stub the controller gates
        # on (never a draft-hash compare — proven unconditionally fail-open in design review).
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "$base" ]; then
            # checkout@v4 puts the PR MERGE commit at HEAD, so merge-base..HEAD is exactly the
            # PR's own changes — never HEAD~1 (that would be one side of the merge, not the PR).
            changed="$(git diff --diff-filter=AMR --name-only "$base"..HEAD -- 'skills/' || true)"
          else
            # DELIBERATE divergence from the migration step's no-base SKIP: reconcile re-enforces
            # migrations at deploy, but NOTHING downstream saves this class — so no computable
            # merge-base (and every push, incl. main) fail-closed WIDENS to all tracked skills
            # files. On main this is the backstop: a stub that landed turns main CI red
            # (operator signal + automerge blocker) until authored or deleted.
            changed="$(git ls-files -- 'skills/' || true)"
          fi
          if [ -z "$changed" ]; then echo "no skills/ files to gate"; exit 0; fi
          echo "skill stub gate over:"; echo "$changed"
          # word-splitting $changed into argv is intended; a hostile space-mangled name splits
          # into paths the checker can't read -> exit 1 fail-closed.
          # shellcheck disable=SC2086
          python tools/skill_stub_gate.py $changed
